<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ROH Bar System</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f1f8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
    .logo{font-size:22px;font-weight:700;color:#1a0a2e;margin-bottom:6px;text-align:center;}
    .sub{font-size:14px;color:#888;margin-bottom:36px;text-align:center;}
    .card{background:#fff;border-radius:18px;border:1px solid #e8e4f0;overflow:hidden;width:100%;max-width:340px;margin-bottom:16px;text-decoration:none;display:block;transition:transform 0.15s,box-shadow 0.15s;}
    .card:active{transform:scale(0.98);}
    .card-inner{padding:20px 22px;display:flex;align-items:center;gap:16px;}
    .card-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
    .sup .card-icon{background:#1a0a2e;}
    .chef .card-icon{background:#0f3d2e;}
    .card-text{}
    .card-title{font-size:16px;font-weight:700;margin-bottom:3px;}
    .sup .card-title{color:#1a0a2e;}
    .chef .card-title{color:#0f3d2e;}
    .card-desc{font-size:12px;color:#888;line-height:1.4;}
    .card-arrow{margin-left:auto;font-size:18px;color:#ccc;flex-shrink:0;}
  </style>
</head>
<body>
  <div class="logo">ROH Bar</div>
  <div class="sub">Select your view</div>

  <a href="supervisor.html" class="card sup">
    <div class="card-inner">
      <div class="card-icon">🍷</div>
      <div class="card-text">
        <div class="card-title">Supervisor</div>
        <div class="card-desc">Enter orders and view the live combined prep sheet</div>
      </div>
      <div class="card-arrow">›</div>
    </div>
  </a>

  <a href="chef.html" class="card chef">
    <div class="card-inner">
      <div class="card-icon">👨‍🍳</div>
      <div class="card-text">
        <div class="card-title">Chef / Kitchen</div>
        <div class="card-desc">See totals, strike off items, track prep progress</div>
      </div>
      <div class="card-arrow">›</div>
    </div>
  </a>
</body>
</html>
